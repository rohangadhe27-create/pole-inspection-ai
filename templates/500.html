{% extends "base.html" %}

{% block title %}Server Error - Power Line Pole AI{% endblock %}
{% block page_title %}500 - Server Error{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm rounded-3 text-center p-5">
    <div class="mb-3 text-danger">
        <i class="fa-solid fa-bug" style="font-size: 4rem; opacity: 0.6;"></i>
    </div>
    <h3 class="fw-bold text-dark">Internal Server Error</h3>
    <p class="text-muted">{{ error or 'An unexpected error occurred processing your request.' }}</p>
    <div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
